name: Unit Testing
on:
  push:
    branches: [master, forbidden]
  pull_request:
    branches: [master, forbidden]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: unit-testing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
