name: Prettify
on:
  pull_request:
    branches: [master, forbidden]
permissions:
  contents: read
concurrency:
  group: prettify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Prettier formatting
        run: |-
          if ! npx --no-install prettier --check .; then
            echo "::error title=Prettier::Formatting issues found. Run 'npm run format' locally, commit the result, and push."
            exit 1
          fi
