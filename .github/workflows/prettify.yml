name: Prettify
on:
  pull_request:
    branches: [master, forbidden]
permissions:
  actions: write
  contents: write
  pull-requests: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run Prettier
        run: npm run format:check
      - name: Fail if formatting changes are needed
        run: |-
          CHANGED_FILES=$(git status --porcelain)
          if [[ -n "$CHANGED_FILES" ]]; then
            echo "::error::Prettier found unformatted files. Run 'npm run format' locally and commit the result."
            echo "The following files need formatting:"
            echo "$CHANGED_FILES"
            git --no-pager diff
            exit 1
          else
            echo "All files are properly formatted."
          fi
